name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: make check
      - name: Tests
        run: make test
      - name: Install into a staging dir
        run: make install DESTDIR="$RUNNER_TEMP/stage" PREFIX=/usr
